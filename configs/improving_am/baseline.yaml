# AM Grid Search Baseline Configuration

# Explicit model checkpoint (T250 best). If empty, auto-resolves.
model_path: "models/best_T250.pth"

# Fixed selections
layer_idx: 10          # legacy single-layer path; ignored if selection.mode is set
filter_idx: auto       # legacy single-filter path; ignored if selection.mode is set
# Use the T250 20-sample analysis dataset
dataset_path: data/wave_dataset_T250_validation.h5
sample_idx: 0          # unused when grid.sample_indices is provided

# Multi-layer/multi-filter selection
selection:
  mode: explicit          # options: last_n | explicit
  last_n_layers: 20       # ignored in explicit mode
  # IMPORTANT: layer_indices are 0-based positions in the conv_layers list
  # (after filtering skip/projection convs), not internal named_modules ids.
  layer_indices: [0]      # e.g., 0 is the first Conv2d encountered, up to 16
  top_k_filters: 2
  filters_by_layer: {}

# Grid
grid:
  learning_rates: [0.002]
  iterations: [100]
  tv_regs: [20]
  l2_regs: [20]
  activation_modes: [post_relu_mean]
  sample_indices: [0]
  suppression_weights: [1]

# Convergence criteria (evaluated over last K iterations)
convergence:
  last_k: 200
  slope_eps: 5.0e-2
  std_eps: 5.0e-1
  grad_eps: 1.0e-2


